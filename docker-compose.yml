# PostgreSQL 17 with the pgvector extension available.
# Start:  docker compose up -d
# Stop:   docker compose down        (data is kept in the "pgdata" volume)
# Reset:  docker compose down -v     (deletes all data)
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: csu_tbi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Only this computer can connect (not the rest of the network).
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
