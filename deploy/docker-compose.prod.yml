# CSU-TBI Track: the hosted client review version, everything on ONE small server (docs/DEPLOY.md).
# NOT the development database (that is ../docker-compose.yml). Always run it through deploy/compose.sh, which passes
# the server's .env (/opt/csu-tbi/.env, readable by root only):
#   sudo deploy/compose.sh up -d --build      # build and start (the release step runs migrations first)
#   sudo deploy/compose.sh ps                 # what is running
#   sudo deploy/compose.sh logs -f web        # the web server's log (Ctrl+C stops following)
#
# Services: db (PostgreSQL + pgvector, never published), release (one-off: check, migrate, seed, static files),
# web (gunicorn), worker (Django-Q2 qcluster), caddy (HTTPS with a free automatic certificate, the only open ports).
# Memory: sized for about 1 GB of RAM plus a swap file (server-setup.sh); see docs/DEPLOY.md "Low memory".
name: csu-tbi

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }  # Docker logs never fill the disk

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: csu-tbi-app:latest
  env_file:
    - ${ENV_FILE:-/opt/csu-tbi/.env}
  environment:
    # Always the database container, whatever .env says (POSTGRES_HOST=127.0.0.1 is the Windows development value).
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
  volumes:
    - media:/app/media
  logging: *logging
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg17
    env_file:
      - ${ENV_FILE:-/opt/csu-tbi/.env}
    environment:
      TZ: Asia/Manila
    # Small-memory settings (about 1 GB on the whole server). No "ports:": only the containers here can connect.
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=48MB
      - -c
      - max_connections=30
      - -c
      - max_wal_size=256MB
      - -c
      - log_timezone=Asia/Manila
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 320m
    memswap_limit: 640m
    logging: *logging
    restart: unless-stopped

  release:
    <<: *app
    command: ["sh", "deploy/release.sh"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    mem_limit: 400m
    memswap_limit: 800m

  web:
    <<: *app
    command: ["sh", "deploy/start-web.sh"]
    depends_on:
      db: { condition: service_healthy }
      release: { condition: service_completed_successfully }
    healthcheck:
      # The app and its database answer (config.views.healthz). The Host header must be an allowed host.
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/healthz/', headers={'Host': os.environ.get('SITE_DOMAIN', 'localhost')}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 400m
    memswap_limit: 800m

  worker:
    <<: *app
    command: ["python", "manage.py", "qcluster"]
    depends_on:
      db: { condition: service_healthy }
      release: { condition: service_completed_successfully }
    stop_grace_period: 60s  # lets a running task (a PDF, an email) finish
    mem_limit: 400m
    memswap_limit: 800m

  caddy:
    image: caddy:2.8.4-alpine
    env_file:
      - ${ENV_FILE:-/opt/csu-tbi/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy_data:/data  # the certificates: keep this volume (asking again too often hits rate limits)
      - caddy_config:/config
    depends_on:
      web: { condition: service_started }
    mem_limit: 64m
    memswap_limit: 128m
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
  media:
  static:
  caddy_data:
  caddy_config:
