<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Change password - CSU-TBI Track</title></head>
<body>
  <h1>Change your password</h1>
  {% if user.must_change_password %}<p>Please choose a new password before you continue.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Change password</button>
  </form>
  <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
</body>
</html>
