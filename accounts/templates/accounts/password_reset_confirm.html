{# TEMPORARY plain form. Replaced by the real page in the frontend phase. #}
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Choose a new password - CSU-TBI Track</title></head>
<body>
  <h1>Choose a new password</h1>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Save the new password</button>
    </form>
  {% else %}
    <p>This link is not valid: it was already used or has expired. <a href="{% url 'accounts:password_forgot' %}">Ask for a new link.</a></p>
  {% endif %}
</body>
</html>
