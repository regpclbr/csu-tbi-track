[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
# Parallel by default: 2 workers, each with its own test database (test_<name>_gw0, _gw1). Measured on
# the development laptop (4 CPUs, 8 GB RAM shared with Docker): 4 workers made it swap and were slower
# than 2. A bigger machine can pass -n auto. The test databases are kept between runs; after adding or
# changing migrations run once with --create-db. Debugging: -n 0 runs everything in one process.
addopts = -n 2 --reuse-db
markers =
    real_weasyprint: renders with real WeasyPrint (skipped when its system libraries are missing)
