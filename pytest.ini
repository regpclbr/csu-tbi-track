[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
# Parallel by default (one worker per CPU, each with its own test database test_<name>_gw0, _gw1, ...),
# and the test databases are kept between runs. After adding or changing migrations run once with
# --create-db. Debugging: -n 0 runs everything in one process (pdb and print work normally).
addopts = -n auto --reuse-db
markers =
    real_weasyprint: renders with real WeasyPrint (skipped when its system libraries are missing)
