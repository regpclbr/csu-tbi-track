{% comment %}An activity's fields as a description list (activities.pages.detail_rows), with the description first.{% endcomment %}
{% if activity.description %}<p class="mb-5 text-[15px] leading-relaxed whitespace-pre-line text-slate-700">{{ activity.description }}</p>{% endif %}
<dl class="grid gap-x-6 gap-y-4 sm:grid-cols-2 xl:grid-cols-3">
  {% for label, value in detail_rows %}
    <div class="min-w-0">
      <dt class="text-xs font-semibold tracking-wide text-muted uppercase">{{ label }}</dt>
      <dd class="mt-0.5 text-[15px] [overflow-wrap:anywhere] text-ink">{{ value|default:"–" }}</dd>
    </div>
  {% endfor %}
</dl>
