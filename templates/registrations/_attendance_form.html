{% comment %}Inside the "Mark attended" modal (the modal sits inside the attendance form, so this submits it).{% endcomment %}
<p class="mb-3 text-sm text-slate-700" x-text="selected.length + ' registration' + (selected.length === 1 ? '' : 's') + ' selected.'"></p>
<fieldset>
  <legend class="mb-2 text-sm font-semibold text-ink">How was attendance confirmed?</legend>
  <div class="space-y-2">
    {% for value, label in methods %}
      <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-line px-4 py-3 hover:bg-slate-50 has-[:checked]:border-primary has-[:checked]:bg-primary-soft/50">
        <input type="radio" name="method" value="{{ value }}" class="size-4 accent-primary"{% if forloop.first %} checked autofocus{% endif %}>
        <span class="text-sm font-medium text-ink">{{ label }}</span>
      </label>
    {% endfor %}
  </div>
</fieldset>
<div class="mt-5 flex justify-end gap-2">
  <button type="button" class="btn btn-secondary" @click="close()">Cancel</button>
  <button type="submit" name="action" value="mark" class="btn btn-primary" :disabled="!selected.length">Mark attended</button>
</div>
