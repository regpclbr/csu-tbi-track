{# Errors that belong to the whole form (form.non_field_errors), e.g. "Invalid email or password." #}
{% if form.non_field_errors %}
  <div class="flex gap-3 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert">
    {% include "components/icon.html" with name="circle-alert" class="mt-0.5 size-4.5" %}
    <div class="space-y-1">{% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}</div>
  </div>
{% endif %}
