{# An image file input of the certificate design forms. id, accept, help, error, max_mb (context). The server checks the real content. #}
<div>
  <label for="{{ id }}" class="text-sm font-semibold text-ink">Image</label>
  <input id="{{ id }}" type="file" name="file" accept="{{ accept }}"
         class="mt-1.5 block w-full max-w-full text-sm text-slate-700 file:mr-3 file:rounded-full file:border-0 file:bg-primary file:px-4 file:py-2 file:text-sm file:font-semibold file:text-white hover:file:bg-primary-hover"
         aria-describedby="{{ id }}-help{% if error %} {{ id }}-error{% endif %}"{% if error %} aria-invalid="true" autofocus{% endif %}>
  <p id="{{ id }}-help" class="field-help">{{ help }} Up to {{ max_mb }} MB. The file's content is checked, not only its name.</p>
  {% if error %}<p id="{{ id }}-error" class="field-error">{{ error }}</p>{% endif %}
</div>
