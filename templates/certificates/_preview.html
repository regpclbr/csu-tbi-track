{% comment %}
The certificate preview (certificates.page_views.preview_dialog, certificates.pages.preview; ASSUMPTIONS 358): number,
recipient, status, Download PDF and Close, then the PDF in an <iframe> of certificates:preview (rendered now from the same
template as the final PDF, with both signatures; a small "PREVIEW" mark while it waits for approval).
standalone=True: its own page without JavaScript (Close becomes a link back to the Certificates tab).
{% endcomment %}
<div class="flex flex-wrap items-start justify-between gap-4">
  <div class="min-w-0">
    <p class="text-xs font-semibold tracking-wide text-primary uppercase">Certificate of {{ kind }}</p>
    <h2 id="certificate-preview-title" class="mt-1 text-xl leading-tight font-bold break-words text-ink">{{ certificate.certificate_number }} · {{ recipient }}</h2>
    <div class="mt-2 flex flex-wrap items-center gap-2 text-xs text-muted">
      {% include "components/badge.html" with text=status.label tone=status.tone %}
      {% if marked %}<span>Marked “PREVIEW” until it is approved.</span>{% endif %}
    </div>
  </div>
  <div class="flex items-center gap-2">
    <a href="{{ download_url }}" class="btn btn-secondary btn-sm">{% include "components/icon.html" with name="download" class="size-4" %}Download PDF<span class="sr-only"> of {{ certificate.certificate_number }}</span></a>
    {% if standalone %}
      <a href="{{ back }}" class="btn btn-ghost btn-sm">{% include "components/icon.html" with name="x" class="size-4" %}Close</a>
    {% else %}
      <button type="button" class="btn btn-ghost btn-sm" onclick="this.closest('dialog').close()" autofocus>{% include "components/icon.html" with name="x" class="size-4" %}Close</button>
    {% endif %}
  </div>
</div>
{% if not name_final %}
  <p class="mt-3 flex items-start gap-2 rounded-xl bg-primary-soft px-3 py-2 text-sm text-slate-700" role="note">
    {% include "components/icon.html" with name="info" class="mt-0.5 size-4 text-primary" %}
    <span>Shown with the registration name “{{ name }}”. The final name comes from the evaluation.</span></p>
{% endif %}
<div class="mt-4">
  <iframe src="{{ file_url }}" title="Preview of certificate {{ certificate.certificate_number }}" class="h-[70vh] w-full rounded-xl border border-line bg-slate-50"></iframe>
</div>
