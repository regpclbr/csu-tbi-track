{% comment %}The confirm dialog of the Certificate text page (one type): the impact (services.default_text_impact_text), then it
submits that type's form (form="text-form-<type>").{% endcomment %}
<div class="space-y-4">
  <p class="text-sm text-slate-700">{{ kind.impact }}</p>
  <div class="flex justify-end gap-2">
    <button type="button" class="btn btn-secondary" @click="close()" autofocus>Cancel</button>
    <button type="submit" form="text-form-{{ kind.type }}" class="btn btn-primary">Save</button>
  </div>
</div>
